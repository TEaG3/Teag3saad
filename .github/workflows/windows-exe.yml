name: Build Saad PS2 Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "ps2-database.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install
      - name: Build Portable and Setup EXE
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saad-PS2-Windows-EXE
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update the latest Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Saad PS2 Ultimate — Latest Windows Build
          body: |
            أحدث إصدار Windows من Saad PS2 Ultimate.

            - Portable EXE: يعمل دون تثبيت تقليدي.
            - Setup EXE: مثبت Windows مع اختصار.
            - إذا كان Windows يعرض تحذير الناشر، فهذا لأن الملفات غير موقعة رقمياً حالياً.
          files: desktop/release/*.exe
          make_latest: true
          fail_on_unmatched_files: true
