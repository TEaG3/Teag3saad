name: Build Saad PS2 Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "ps2-database.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "data/**"
      - "tests/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows Setup EXE
        working-directory: desktop
        run: npm run dist:setup
      - name: Upload Windows Setup installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saad-PS2-Windows-Setup
          path: desktop/release/Saad-PS2-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Remove obsolete assets from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset desktop-latest "$asset" --yes
            done < <(gh release view desktop-latest --json assets --jq '.assets[].name')
          fi
      - name: Publish or update the latest Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Saad PS2 Ultimate — Latest Windows Build
          body: |
            أحدث إصدار Windows من Saad PS2 Ultimate.

            - Setup EXE: مثبت Windows مع اختصار لسطح المكتب وقائمة ابدأ.
            - متوافق مع Windows 10 وWindows 11 (64-bit).
            - Windows 7 غير مدعوم في إصدار Electron الحالي.
            - إذا كان Windows يعرض تحذير الناشر، فهذا لأن الملف غير موقع رقمياً حالياً.
          files: desktop/release/Saad-PS2-Setup-*.exe
          make_latest: true
          fail_on_unmatched_files: true
